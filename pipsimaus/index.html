<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pipsimaus & Ron – Frühlingsrollen</title><style>*{box-sizing:border-box}body{margin:0;background:#151923;color:#fff;font-family:system-ui,Arial,sans-serif}.app{max-width:1500px;min-height:100dvh;margin:auto;display:flex;flex-direction:column;padding:clamp(10px,2vw,24px);gap:12px}header,.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{font-size:clamp(18px,2.6vw,32px);margin:0}.stage{flex:1;display:grid;grid-template-columns:1.2fr 1fr;gap:18px;min-height:0}.art{border-radius:22px;background:radial-gradient(circle at 50% 30%,#f8d9a5,#e39a67 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;min-height:280px}.art .picture{font-size:clamp(65px,11vw,175px);text-align:center;line-height:1.4}.art .mice{font-size:clamp(32px,5vw,68px)}.copy{border-radius:22px;background:#252c3b;padding:clamp(18px,3vw,40px);display:flex;flex-direction:column;justify-content:center;gap:20px}.copy h2{font-size:clamp(24px,3vw,46px);margin:0}.copy p{font-size:clamp(17px,1.8vw,27px);line-height:1.45;margin:0}.joke{background:#384354;border-left:5px solid #f5c96a;padding:18px;border-radius:10px}button{background:#f6c96b;color:#191919;border:0;border-radius:12px;padding:13px 22px;font-size:18px;font-weight:700;cursor:pointer}button:disabled{opacity:.4}#count{font-weight:700}#auto[aria-pressed=true]{background:#9de2a3}@media(max-width:720px){.stage{grid-template-columns:1fr}.art{min-height:220px}.copy{gap:12px}.copy h2{font-size:25px}.copy p{font-size:17px}.app{min-height:100dvh}}@media(orientation:landscape){.app{height:100dvh}.stage{min-height:0}.art{min-height:0}} </style></head><body><main class="app"><header><h1>🐭 Pipsimaus & Ron: Frühlingsrollen</h1><span id="count">1 / 20</span></header><section class="stage"><div class="art" role="img" aria-label="Comic-Symbol der Kochszene"><div class="picture" id="picture">🥬🥕</div><div class="mice">🐭 👩‍🍳 🐭</div></div><div class="copy"><h2 id="heading"></h2><p id="instructions"></p><p class="joke" id="joke"></p></div></section><nav class="controls"><button id="prev" type="button">← Zurück</button><button id="auto" type="button" aria-pressed="false">▶ Auto 10 s</button><button id="full" type="button">⛶ Vollbild</button><button id="next" type="button">Weiter →</button></nav></main><script>const scenes=[["Servus aus der Mäuseküche","Heute machen wir 20 große Frühlingsrollen wie beim Wiener Chinesen.","Ron: „Pipsi, bestellen wir?“ Pipsi: „Na, heut wird selber gekocht!“","🐭🥢"],["Zutaten herrichten","600 g Weißkraut, 150 g Karotten, 250 g Sojasprossen, 4 Jungzwiebeln, 50 g trockene Glasnudeln, 20 Teigblätter, 3 EL Sojasauce, 1 TL Sesamöl, ½ TL weißer Pfeffer und 2 EL Öl.","Ron: „Des is ja a ganzer Gemüsestand!“","🥬🥕"],["Teig auftauen","Die geschlossene Packung Frühlingsrollenblätter 90–120 Minuten bei Zimmertemperatur auftauen. Erst dann vorsichtig trennen.","Pipsi: „Ned gefroren auseinanderreißen, Ron!“","🧊📦"],["Kraut schneiden","600 g Weißkraut ohne Strunk in 3–5 mm breite, 4–6 cm lange Streifen schneiden.","Ron: „Millimeterfein?“ Pipsi: „Na, wir machen ka Zahnpasta!“","🥬🔪"],["Karotten schneiden","150 g Karotten schälen und in etwa 2 mm dünne, 4–5 cm lange Stifte schneiden.","Ron: „A bissl dicker geht a?“ Pipsi: „Dann brauchen's länger, du Künstler!“","🥕🔪"],["Jungzwiebeln schneiden","Vier Jungzwiebeln putzen und in 3–5 mm breite Ringe schneiden.","Ron: „Die grünen Enden a?“ Pipsi: „Ja, wenn's frisch san!“","🧅🔪"],["Sprossen waschen","250 g Sojasprossen gründlich waschen und sehr gut abtropfen lassen.","Pipsi: „Wasser in der Füllung macht die Rollen letschert!“","🌱💧"],["Glasnudeln einweichen","50 g trockene Glasnudeln in heißem Wasser nach Packungsangabe, meist 5–8 Minuten, einweichen. Abgießen und auf 4–5 cm kürzen.","Ron: „Trocken in den Wok?“ Pipsi: „Geh bitte, zuerst ins Wasser!“","🍜💦"],["Pfanne vorheizen","Große Pfanne oder Wok kräftig erhitzen. Das Gemüse in zwei Portionen braten, damit es nicht im eigenen Saft dünstet.","Ron: „Alles auf einmal?“ Pipsi: „Nur wennst a Krautsuppn willst!“","🍳🔥"],["Kraut und Karotten braten","Pro Portion 1 EL neutrales Öl. Je die Hälfte Kraut und Karotten 4–5 Minuten unter Wenden kräftig braten.","Pipsi: „Braten, ned kochen!“","🥬🍳"],["Jungzwiebeln dazu","Jeweils die Hälfte der Jungzwiebeln dazugeben und ungefähr 1 Minute mitbraten.","Ron: „Jetzt riecht's schon nach Chinesen!“","🧅🍳"],["Sprossen dazu","Jeweils die Hälfte der Sojasprossen 1–2 Minuten mitbraten. Sie sollen noch etwas Biss haben.","Pipsi: „Ned totkochen, Ron!“","🌱🍳"],["Glasnudeln und Würze","Alles zusammenführen. Glasnudeln, 3 EL Sojasauce und ½ TL weißen Pfeffer zugeben. Rund 1 Minute durchschwenken.","Ron: „Jetzt wird's ernst!“","🍜🥢"],["Sesamöl zum Schluss","1 TL Sesamöl erst zum Schluss einrühren. Abschmecken; bei Bedarf wenig Salz zugeben.","Pipsi: „Sesamöl is a Gewürz, ka Badewasser!“","🫙✨"],["Füllung abkühlen","Füllung flach auf einem Blech verteilen und mindestens 20 Minuten vollständig abkühlen lassen. Flüssigkeit abgießen.","Ron: „I bin schon hungrig!“ Pipsi: „Geduld is a Kochzutat!“","🥗❄️"],["Blätter vorbereiten","Aufgetaute Teigblätter vorsichtig trennen. Unbenutzte Blätter mit leicht feuchtem Tuch abdecken.","Pipsi: „Sonst trocknen's aus und reißen!“","📄🧺"],["Füllen und falten","Ein Blatt als Raute hinlegen. Etwa 45–55 g Füllung ins untere Drittel geben. Untere Ecke darüber, Seiten einschlagen und straff rollen.","Ron: „Je mehr Füllung, desto besser?“ Pipsi: „Bis dir alles platzt!“","🥟🙌"],["Verschließen","1 EL Mehl mit etwa 1½ EL Wasser verrühren. Die letzte Spitze damit festkleben. Naht nach unten ablegen.","Pipsi: „Jetzt bleibt alles dort, wo's hinghört!“","🥣🥟"],["Goldbraun herausbacken","In 2–3 cm Öl bei 170–175 °C portionsweise etwa 4–6 Minuten goldbraun backen, bei Bedarf wenden. Auf Gitter abtropfen lassen.","Ron: „Des zischt ja!“ Pipsi: „Genau so soll's sein!“","🍳🥟"],["Mahlzeit!","Frühlingsrollen heiß und knusprig servieren, gern mit süß-saurer Sauce.","Ron: „Pipsi, besser als beim Chinesen!“ Pipsi: „Na, übertreib ned. Nimm da no ane!“","🐭🥟"]];let current=0,timer=null;const $=id=>document.getElementById(id);function render(){let s=scenes[current];$('heading').textContent=s[0];$('instructions').textContent=s[1];$('joke').textContent=s[2];$('picture').textContent=s[3];$('count').textContent=(current+1)+' / '+scenes.length;$('prev').disabled=current===0;$('next').textContent=current===scenes.length-1?'Von vorne ↻':'Weiter →'}function move(d){current=(current+d+scenes.length)%scenes.length;render()}$('next').addEventListener('click',()=>move(1));$('prev').addEventListener('click',()=>move(-1));$('auto').addEventListener('click',()=>{if(timer){clearInterval(timer);timer=null}else{timer=setInterval(()=>move(1),10000)}$('auto').setAttribute('aria-pressed',String(!!timer));$('auto').textContent=timer?'⏸ Pause':'▶ Auto 10 s'});$('full').addEventListener('click',()=>{if(document.fullscreenElement){document.exitFullscreen()}else{document.documentElement.requestFullscreen?.()}});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});render();</script></body></html>
